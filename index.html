  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kingbourne | Strategic Advisory</title>

  <!-- Kingbourne favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <meta
    name="description"
    content="Kingbourne provides discreet, considered business advisory services."
  >

  <!-- Elegant serif typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #090d1a;
      --purple: #1b1230;
      --gold: #c8a96b;
      --soft-gold: #a9946c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(72, 38, 104, 0.34) 0%,
          rgba(25, 20, 54, 0.22) 30%,
          transparent 62%
        ),
        linear-gradient(
          145deg,
          var(--background) 0%,
          #0d1022 48%,
          var(--purple) 100%
        );
      color: var(--gold);
      text-align: center;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.025) 48%,
          transparent 75%
        );
    }

    .identity {
      position: relative;
      width: min(90%, 760px);
      margin: auto;
      padding: 3rem 1.5rem;
      animation: appear 1.3s ease-out both;
    }

    .name {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: 0.015em;
      color: var(--gold);
      text-shadow: 0 3px 28px rgba(0, 0, 0, 0.25);
    }

    .rule {
      width: 48px;
      height: 1px;
      margin: 2rem auto 1.7rem;
      border: 0;
      background: rgba(200, 169, 107, 0.65);
    }

    .description {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      font-size: clamp(0.72rem, 1.5vw, 0.88rem);
      font-weight: 300;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--soft-gold);
    }

    .email {
      display: inline-block;
      margin-top: 1.35rem;
      font-family: "Inter", Arial, sans-serif;
      font-size: clamp(0.72rem, 1.5vw, 0.86rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: rgba(200, 169, 107, 0.82);
      text-decoration: none;
      transition:
        color 180ms ease,
        opacity 180ms ease;
    }

    .email:hover,
    .email:focus-visible,
    .site-footer a:hover,
    .site-footer a:focus-visible {
      color: #e0c58f;
    }

    .email:focus-visible,
    .site-footer a:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 6px;
    }

    .site-footer {
      width: 100%;
      padding: 0.85rem 1.5rem 1.25rem;
      font-family: "Inter", Arial, sans-serif;
      font-size: 0.67rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: rgba(169, 148, 108, 0.62);
    }

    .site-footer a {
      color: inherit;
      text-decoration: none;
      transition: color 180ms ease;
    }

    .site-footer .separator {
      margin: 0 0.55rem;
      opacity: 0.55;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .identity {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="identity">
    <h1 class="name">Kingbourne</h1>

    <hr class="rule">

    <p class="description">Strategic Advisory</p>

    <a class="email" href="mailto:info@kingbourne.co.uk">
      info@kingbourne.co.uk
    </a>
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Kingbourne</span>
    <span class="separator" aria-hidden="true">&middot;</span>
    <a href="privacy.html">Privacy</a>
  </footer>
</body>
</html>
